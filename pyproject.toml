[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddbj-mss-tools"
version = "0.1.0"
description = "Tools to create DDBJ MSS submission files"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "biopython",
    "pandas",
    "openpyxl",
    "jsonschema",
]

# ddbj-gff is only required by the gff2mss subtool. It is an optional extra so
# the other tools (egapx2mss, mss_builder, mss2ff, batch_wgs_builder) install
# and run without it. Install gff2mss support with: pip install "ddbj-mss-tools[gff2mss]"
[project.optional-dependencies]
gff2mss = ["ddbj-gff"]

[project.scripts]
egapx2mss         = "egapx2mss.cli:main"
mss_builder       = "mss_builder.cli:main"
mss2ff            = "mss2ff.cli:main"
batch_wgs_builder = "batch_wgs_builder.cli:main"
gff2mss           = "gff2mss.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/common",
    "src/egapx2mss",
    "src/mss_builder",
    "src/mss2ff",
    "src/batch_wgs_builder",
    "src/gff2mss",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: integration/perf tests against large example files (deselect with '-m \"not slow\"')"]

# ddbj-gff (GFF canonicalization library) is a local sibling repo during migration.
# uv dev uses the path source below; container/CI installs the ddbj-gff wheel (follow-up).
[tool.uv.sources]
ddbj-gff = { path = "../gff_submission", editable = true }
