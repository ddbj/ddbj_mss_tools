[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddbj-mss-tools"
version = "0.1.0"
description = "Tools to create DDBJ MSS submission files"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "biopython",
    "pandas",
    "openpyxl",
    "jsonschema",
]

[project.scripts]
egapx2mss         = "egapx2mss.cli:main"
mss_builder       = "mss_builder.cli:main"
mss2ff            = "mss2ff.cli:main"
batch_wgs_builder = "batch_wgs_builder.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/common",
    "src/egapx2mss",
    "src/mss_builder",
    "src/mss2ff",
    "src/batch_wgs_builder",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
